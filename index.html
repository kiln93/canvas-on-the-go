<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#faf8f5" />
    <title>Canvas on the go</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; background: #faf8f5; }
      .boot { position: fixed; inset: 0; display: flex; gap: 12px; align-items: center; justify-content: center;
        font: 500 14px Inter, system-ui, sans-serif; color: #72706b; }
      .boot-dot { width: 10px; height: 10px; border-radius: 50%; background: #016a71; animation: boot 1.2s ease-in-out infinite; }
      @keyframes boot { 0%, 100% { transform: scale(0.6); opacity: 0.4; } 50% { transform: scale(1); opacity: 1; } }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Shown until the app starts; React replaces it. -->
      <div class="boot" role="status"><span class="boot-dot"></span><span>Opening your canvas…</span></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
